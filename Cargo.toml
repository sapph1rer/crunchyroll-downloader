[package]
name = "crunchyroll-downloader"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Downloads anime from Crunchyroll and outputs them as MKV (Rust port of CuteTenshii/crunchyroll-downloader)"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
rsa = { version = "0.9", features = ["pem", "sha1"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
cmac = "0.7"
rand = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ctr = "0.9"
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["tokio-rt", "gzip", "cookies", "webpki-roots", "form", "stream"] }
wreq-util = "3.0.0-rc.14"
anstream = "0.6"
anstyle = "1"
dirs = "6"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1.9.1", features = ["derive"] }
iced = { version = "0.14", features = ["tokio", "advanced"], optional = true }
rfd = { version = "0.17", optional = true }

[features]
default = ["gui"]
gui = ["dep:iced", "dep:rfd"]

[[bin]]
name = "crunchyroll-downloader-gui"
path = "src/gui/main.rs"
required-features = ["gui"]
